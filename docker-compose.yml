services:
  db:
    image: postgres:16-alpine
    container_name: moneymind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: moneymind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneymind"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneymind_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/moneymind
      SECRET_KEY: moneymind_super_secret_production_key_2026
      FALLBACK_TO_SQLITE: "False"
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
