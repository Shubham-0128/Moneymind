<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMind | Personal Expense Tracker</title>
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="var(--primary)"/>
                    <path d="M13.5 10C13.5 9.17 12.83 8.5 12 8.5C11.17 8.5 10.5 9.17 10.5 10C10.5 11.2 12.75 11.08 12.75 12.5C12.75 13.33 12.08 14 11.25 14C10.42 14 9.75 13.33 9.75 12.5H8.25C8.25 14.16 9.58 15.5 11.25 15.5V17H12.75V15.5C14.42 15.5 15.75 14.16 15.75 12.5C15.75 11.3 13.5 11.42 13.5 10Z" fill="var(--primary)"/>
                </svg>
                <h1>MoneyMind</h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-grid">
            
            <!-- Left Column -->
            <div class="column-left">
                <!-- Month Summary Card -->
                <section class="card summary-card">
                    <h2>This Month's Spending</h2>
                    <div class="total-amount" id="month-total">₹0.00</div>
                    <div id="budget-warning" class="budget-warning hidden">
                        <!-- Warning message will be injected here -->
                    </div>
                </section>

                <!-- Add Expense Form -->
                <section class="card form-card">
                    <h2>Add Expense</h2>
                    <form id="expense-form">
                        <div class="form-group">
                            <label for="exp-amount">Amount (₹) *</label>
                            <input type="number" id="exp-amount" min="0.01" step="0.01" required placeholder="e.g. 500">
                        </div>
                        <div class="form-group">
                            <label for="exp-category">Category *</label>
                            <select id="exp-category" required>
                                <option value="" disabled selected>Select category</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Rent">Rent</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Bills">Bills</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="exp-date">Date *</label>
                            <input type="date" id="exp-date" required>
                        </div>
                        <div class="form-group">
                            <label for="exp-note">Note (Optional)</label>
                            <input type="text" id="exp-note" placeholder="e.g. Lunch with team">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                    </form>
                </section>

                <!-- Goals Section -->
                <section class="card goals-card">
                    <h2>Savings Goals</h2>
                    <form id="goal-form" class="goal-form">
                        <div class="form-row">
                            <input type="text" id="goal-name" placeholder="Goal Name *" required>
                            <input type="number" id="goal-amount" placeholder="Target ₹ *" min="1" required>
                            <input type="date" id="goal-date" required>
                            <button type="submit" class="btn btn-secondary">Add</button>
                        </div>
                    </form>
                    
                    <div id="goals-list" class="goals-list">
                        <!-- Goals will be injected here -->
                    </div>
                    <div id="goals-empty" class="empty-state">No goals set yet.</div>
                </section>
            </div>

            <!-- Right Column -->
            <div class="column-right">
                <!-- Charts -->
                <section class="card charts-card">
                    <h2>Spending Insights</h2>
                    <div class="charts-container">
                        <div class="chart-wrapper pie-chart">
                            <canvas id="categoryChart"></canvas>
                        </div>
                        <div class="chart-wrapper bar-chart">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                </section>

                <!-- Expense List -->
                <section class="card list-card">
                    <h2>Recent Expenses</h2>
                    <div class="table-responsive">
                        <table class="expense-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Note</th>
                                    <th class="amount-col">Amount</th>
                                    <th class="action-col"></th>
                                </tr>
                            </thead>
                            <tbody id="expense-list">
                                <!-- Expenses will be injected here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="expenses-empty" class="empty-state">No expenses yet. Start tracking!</div>
                </section>
            </div>
            
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
